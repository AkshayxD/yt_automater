name: YouTube Shorts Automater

on:
  schedule:
    # Peak Indian engagement times: 9:30 AM IST (4:00 AM UTC) and 7:00 PM IST (1:30 PM UTC)
    - cron: '0 4 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies (ImageMagick & FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick ffmpeg
        
        # Modify ImageMagick policy to allow text rendering (moviepy requires this on Linux)
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!--<policy domain="path" rights="none" pattern="@\*"\/>-->/g' /etc/ImageMagick-6/policy.xml

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install yt-dlp

    - name: Prepare Assets (Download Background Video)
      run: |
        mkdir -p assets
        # Download a short, copyright-free background video dynamically to avoid bloating the repo
        yt-dlp "ytsearch1:no copyright minecraft parkour gameplay short" -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/mp4" -o "assets/background.mp4"

    - name: Run Bot Pipeline
      env:
        # Pulls the secret base64 token you set in GitHub Repo Settings
        YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
      run: |
        python main.py
