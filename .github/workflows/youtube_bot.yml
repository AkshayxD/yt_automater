name: YouTube Shorts Automater

on:
  schedule:
    # 8 videos per day, 3 hours apart
    - cron: '0 0 * * *'    # 12:00 AM UTC (5:30 AM IST)   → Story
    - cron: '0 3 * * *'    # 3:00 AM UTC (8:30 AM IST)    → Would You Rather
    - cron: '0 6 * * *'    # 6:00 AM UTC (11:30 AM IST)   → Quiz
    - cron: '0 9 * * *'    # 9:00 AM UTC (2:30 PM IST)    → Fake Text
    - cron: '0 12 * * *'   # 12:00 PM UTC (5:30 PM IST)   → Dark Psychology
    - cron: '0 15 * * *'   # 3:00 PM UTC (8:30 PM IST)    → History
    - cron: '0 18 * * *'   # 6:00 PM UTC (11:30 PM IST)   → True Crime
    - cron: '0 21 * * *'   # 9:00 PM UTC (2:30 AM IST)    → Inspiration
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
    inputs:
      content_type:
        description: 'Content type to generate'
        required: false
        default: 'story'
        type: choice
        options:
          - story
          - inspiration
          - would_you_rather
          - fake_text
          - dark_psychology
          - true_crime
          - number_facts
          - history
          - quiz

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies (ImageMagick & FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick ffmpeg
        
        # Modify ImageMagick policy to allow text rendering (moviepy requires this on Linux)
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!--<policy domain="path" rights="none" pattern="@\*"\/>-->/g' /etc/ImageMagick-6/policy.xml

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore upload history
      uses: actions/cache@v3
      with:
        path: upload_history.json
        key: upload-history-${{ github.run_number }}
        restore-keys: |
          upload-history-

    - name: Restore used segments history
      uses: actions/cache@v3
      with:
        path: used_segments.json
        key: used-segments-${{ github.run_number }}
        restore-keys: |
          used-segments-

    - name: Cache background assets
      uses: actions/cache@v3
      id: cache-bg
      with:
        path: assets
        key: bg-assets-v3

    - name: Download Montserrat font (if not cached)
      run: |
        mkdir -p assets/fonts
        if [ ! -f assets/fonts/Montserrat-ExtraBold.ttf ]; then
          echo "Downloading Montserrat ExtraBold from Google Fonts..."
          wget -q "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf" -O assets/fonts/Montserrat-ExtraBold.ttf
          echo "Font downloaded: $(ls -la assets/fonts/Montserrat-ExtraBold.ttf)"
        else
          echo "Montserrat font already cached."
        fi
        
        # Install the font globally in Ubuntu system fonts directory for ImageMagick to access it by name
        sudo mkdir -p /usr/share/fonts/truetype/montserrat
        sudo cp assets/fonts/Montserrat-ExtraBold.ttf /usr/share/fonts/truetype/montserrat/
        sudo fc-cache -f -v

    - name: Download background music (if not cached)
      run: |
        python download_music.py

    - name: Download background videos (if not cached)
      run: |
        python download_backgrounds.py

    - name: Download all assets (including new types)
      run: |
        python download_inspiration_assets.py
        python download_content_assets.py

    - name: Determine content type from schedule
      id: content-type
      run: |
        # If manually triggered with input, use that
        if [ "${{ github.event.inputs.content_type }}" != "" ]; then
          echo "type=${{ github.event.inputs.content_type }}" >> $GITHUB_OUTPUT
          echo "Using manual content type: ${{ github.event.inputs.content_type }}"
        else
          # Auto-detect from cron schedule:
          HOUR=$(date -u +%H)
          if [ "$HOUR" -eq 0 ] || [ "$HOUR" -eq 1 ]; then
            echo "type=story" >> $GITHUB_OUTPUT
            echo "0:00 UTC slot detected → Story"
          elif [ "$HOUR" -eq 3 ] || [ "$HOUR" -eq 4 ]; then
            echo "type=would_you_rather" >> $GITHUB_OUTPUT
            echo "3:00 UTC slot detected → Would You Rather"
          elif [ "$HOUR" -eq 6 ] || [ "$HOUR" -eq 7 ]; then
            echo "type=quiz" >> $GITHUB_OUTPUT
            echo "6:00 UTC slot detected → Quiz"
          elif [ "$HOUR" -eq 9 ] || [ "$HOUR" -eq 10 ]; then
            echo "type=fake_text" >> $GITHUB_OUTPUT
            echo "9:00 UTC slot detected → Fake Text"
          elif [ "$HOUR" -eq 12 ] || [ "$HOUR" -eq 13 ]; then
            echo "type=dark_psychology" >> $GITHUB_OUTPUT
            echo "12:00 UTC slot detected → Dark Psychology"
          elif [ "$HOUR" -eq 15 ] || [ "$HOUR" -eq 16 ]; then
            echo "type=history" >> $GITHUB_OUTPUT
            echo "15:00 UTC slot detected → History"
          elif [ "$HOUR" -eq 18 ] || [ "$HOUR" -eq 19 ]; then
            echo "type=true_crime" >> $GITHUB_OUTPUT
            echo "18:00 UTC slot detected → True Crime"
          elif [ "$HOUR" -eq 21 ] || [ "$HOUR" -eq 22 ]; then
            echo "type=inspiration" >> $GITHUB_OUTPUT
            echo "21:00 UTC slot detected → Inspiration"
          else
            echo "type=story" >> $GITHUB_OUTPUT
            echo "Unknown slot detected → Defaulting to Story"
          fi
        fi

    - name: Run Bot Pipeline
      env:
        # Pulls the secret base64 token you set in GitHub Repo Settings
        YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
        # Gemini API key for AI script rewriting (free tier)
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # How many videos to generate per run (default: 1)
        NUM_VIDEOS: "1"
      run: |
        python main.py --content-type ${{ steps.content-type.outputs.type }}

