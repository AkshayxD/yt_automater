name: YouTube Shorts Automater

on:
  schedule:
    # 4 videos per day — focused niche cluster (psychology/mind/interactive)
    # Fewer, higher-quality videos in a tight niche = stronger algorithm signal
    - cron: '0 3 * * *'    # 3:00 AM UTC (8:30 AM IST)    → Dark Psychology
    - cron: '0 9 * * *'    # 9:00 AM UTC (2:30 PM IST)    → Quiz / Interactive
    - cron: '0 12 * * *'   # 12:00 PM UTC (5:30 PM IST)   → Would You Rather
    - cron: '0 15 * * *'   # 3:00 PM UTC (8:30 PM IST)    → Rotating (history/story/true_crime/number_facts)
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
    inputs:
      content_type:
        description: 'Content type to generate'
        required: false
        default: 'dark_psychology'
        type: choice
        options:
          - story
          - would_you_rather
          - fake_text
          - dark_psychology
          - true_crime
          - number_facts
          - history
          - quiz
          - two_truths
          - riddle
          - survive
          - spot_fake

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies (ImageMagick & FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick ffmpeg
        
        # Modify ImageMagick policy to allow text rendering (moviepy requires this on Linux)
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!--<policy domain="path" rights="none" pattern="@\*"\/>-->/g' /etc/ImageMagick-6/policy.xml

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore upload history
      uses: actions/cache@v3
      with:
        path: upload_history.json
        key: upload-history-${{ github.run_number }}
        restore-keys: |
          upload-history-

    - name: Restore used segments history
      uses: actions/cache@v3
      with:
        path: used_segments.json
        key: used-segments-${{ github.run_number }}
        restore-keys: |
          used-segments-

    - name: Cache background assets
      uses: actions/cache@v3
      id: cache-bg
      with:
        path: assets
        key: bg-assets-v3

    - name: Download Montserrat font (if not cached)
      run: |
        mkdir -p assets/fonts
        if [ ! -f assets/fonts/Montserrat-ExtraBold.ttf ]; then
          echo "Downloading Montserrat ExtraBold from Google Fonts..."
          wget -q "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf" -O assets/fonts/Montserrat-ExtraBold.ttf
          echo "Font downloaded: $(ls -la assets/fonts/Montserrat-ExtraBold.ttf)"
        else
          echo "Montserrat font already cached."
        fi
        
        # Install the font globally in Ubuntu system fonts directory for ImageMagick to access it by name
        sudo mkdir -p /usr/share/fonts/truetype/montserrat
        sudo cp assets/fonts/Montserrat-ExtraBold.ttf /usr/share/fonts/truetype/montserrat/
        sudo fc-cache -f -v

    - name: Download background music (if not cached)
      run: |
        python download_music.py

    - name: Download background videos (if not cached)
      run: |
        python download_backgrounds.py

    - name: Download all assets (including new types)
      run: |
        python download_inspiration_assets.py
        python download_content_assets.py

    - name: Determine content type from schedule
      id: content-type
      run: |
        # If manually triggered with input, use that
        if [ "${{ github.event.inputs.content_type }}" != "" ]; then
          echo "type=${{ github.event.inputs.content_type }}" >> $GITHUB_OUTPUT
          echo "Using manual content type: ${{ github.event.inputs.content_type }}"
        else
          # Auto-detect from cron schedule (4 slots):
          # 3:00 UTC → Dark Psychology (anchor content)
          # 9:00 UTC → Quiz / Interactive (rotating)
          # 12:00 UTC → Would You Rather
          # 15:00 UTC → Rotating older categories
          HOUR=$(date -u +%H)
          if [ "$HOUR" -eq 3 ] || [ "$HOUR" -eq 4 ]; then
            echo "type=dark_psychology" >> $GITHUB_OUTPUT
            echo "3:00 UTC slot → Dark Psychology (anchor)"
          elif [ "$HOUR" -eq 9 ] || [ "$HOUR" -eq 10 ]; then
            # Rotate interactive formats: quiz, two_truths, riddle, survive, spot_fake
            DAY_OF_WEEK=$(date -u +%u)  # 1=Mon, 7=Sun
            case $DAY_OF_WEEK in
              1) echo "type=quiz" >> $GITHUB_OUTPUT; echo "9:00 UTC Mon → Quiz" ;;
              2) echo "type=two_truths" >> $GITHUB_OUTPUT; echo "9:00 UTC Tue → Two Truths" ;;
              3) echo "type=riddle" >> $GITHUB_OUTPUT; echo "9:00 UTC Wed → Riddle" ;;
              4) echo "type=survive" >> $GITHUB_OUTPUT; echo "9:00 UTC Thu → Would You Survive" ;;
              5) echo "type=spot_fake" >> $GITHUB_OUTPUT; echo "9:00 UTC Fri → Spot the Fake" ;;
              6) echo "type=quiz" >> $GITHUB_OUTPUT; echo "9:00 UTC Sat → Quiz" ;;
              7) echo "type=quiz" >> $GITHUB_OUTPUT; echo "9:00 UTC Sun → Quiz" ;;
            esac
          elif [ "$HOUR" -eq 12 ] || [ "$HOUR" -eq 13 ]; then
            echo "type=would_you_rather" >> $GITHUB_OUTPUT
            echo "12:00 UTC slot → Would You Rather"
          elif [ "$HOUR" -eq 15 ] || [ "$HOUR" -eq 16 ]; then
            # Rotate: history, story, true_crime, number_facts, fake_text
            DAY_OF_WEEK=$(date -u +%u)
            case $DAY_OF_WEEK in
              1) echo "type=history" >> $GITHUB_OUTPUT; echo "15:00 UTC Mon → History" ;;
              2) echo "type=true_crime" >> $GITHUB_OUTPUT; echo "15:00 UTC Tue → True Crime" ;;
              3) echo "type=number_facts" >> $GITHUB_OUTPUT; echo "15:00 UTC Wed → Number Facts" ;;
              4) echo "type=story" >> $GITHUB_OUTPUT; echo "15:00 UTC Thu → Story" ;;
              5) echo "type=fake_text" >> $GITHUB_OUTPUT; echo "15:00 UTC Fri → Fake Text" ;;
              6) echo "type=dark_psychology" >> $GITHUB_OUTPUT; echo "15:00 UTC Sat → Dark Psychology (bonus)" ;;
              7) echo "type=history" >> $GITHUB_OUTPUT; echo "15:00 UTC Sun → History" ;;
            esac
          else
            echo "type=dark_psychology" >> $GITHUB_OUTPUT
            echo "Unknown slot → Defaulting to Dark Psychology"
          fi
        fi

    - name: Run Bot Pipeline
      env:
        # Pulls the secret base64 token you set in GitHub Repo Settings
        YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
        # Gemini API key for AI script rewriting (free tier)
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # How many videos to generate per run (default: 1)
        NUM_VIDEOS: "1"
      run: |
        python main.py --content-type ${{ steps.content-type.outputs.type }}

