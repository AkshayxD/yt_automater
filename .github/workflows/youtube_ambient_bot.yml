name: YouTube Ambient Automater

on:
  schedule:
    # 4 ambient videos per day
    - cron: '0 5 * * *'    # 5:00 AM UTC
    - cron: '0 11 * * *'   # 11:00 AM UTC
    - cron: '0 17 * * *'   # 5:00 PM UTC
    - cron: '0 23 * * *'   # 11:00 PM UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ambient Bot Pipeline
      env:
        # Pulls the secret base64 token you set in GitHub Repo Settings
        YOUTUBE_TOKEN_PICKLE_BASE64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_BASE64 }}
        NUM_VIDEOS: "1"
      run: |
        python main.py --format ambient
